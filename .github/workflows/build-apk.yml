name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'icon.png'
      - 'google-services.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          sed -i "s/__APP_BUILD__/${{ github.run_number }}/g" www/index.html
          echo "বিল্ড নম্বর: ${{ github.run_number }}"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Firebase config
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json যোগ হয়েছে"
          else
            echo "Firebase config পাওয়া যায়নি"
          fi

      - name: Generate app icon
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx --yes @capacitor/assets generate --android
          fi

      - name: Configure status bar
        run: |
          cat > android/app/src/main/java/com/sonarupa/hisab/MainActivity.java <<'JAVA'
          package com.sonarupa.hisab;

          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private static final int NAVY = Color.rgb(16, 28, 58);

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              configureBars();

              if (Build.VERSION.SDK_INT >= 28) {
                android.view.WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode =
                    android.view.WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
            }

            @Override
            public void onResume() {
              super.onResume();
              configureBars();
            }

            private void configureBars() {
              getWindow().clearFlags(
                  android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN);

              getWindow().setStatusBarColor(NAVY);
              getWindow().setBackgroundDrawable(new ColorDrawable(NAVY));

              WindowCompat.setDecorFitsSystemWindows(getWindow(), true);

              if (Build.VERSION.SDK_INT >= 29) {
                getWindow().setStatusBarContrastEnforced(false);
              }

              WindowInsetsControllerCompat controller =
                  WindowCompat.getInsetsController(
                      getWindow(), getWindow().getDecorView());

              controller.setAppearanceLightStatusBars(false);
              controller.hide(WindowInsetsCompat.Type.navigationBars());
            }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/res/values/styles.xml")
          s = p.read_text()

          s = re.sub(
              r'\s*<item name="android:windowFullscreen">true</item>',
              '',
              s
          )

          additions = {
              "android:statusBarColor": "#101c3a",
              "android:windowLightStatusBar": "false",
              "android:windowFullscreen": "false",
          }

          for name, value in additions.items():
              tag = f'<item name="{name}">{value}</item>'
              if f'name="{name}"' not in s:
                  s = s.replace("</style>", f"    {tag}\n    </style>", 1)

          p.write_text(s)
          print("Status bar theme configured")
          PY

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          OUT=sona-rupa-hisab.apk
          cp "$APK" "$OUT"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > goldmanager.p12
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

            "$BT/zipalign" -f -p 4 "$APK" aligned.apk

            if "$BT/apksigner" sign \
              --ks goldmanager.p12 \
              --ks-type PKCS12 \
              --ks-pass pass:goldmanager \
              --key-pass pass:goldmanager \
              --ks-key-alias goldmanager \
              --out "$OUT" aligned.apk; then
              echo "স্থায়ী কী দিয়ে সাইন হয়েছে"
            else
              echo "সাইন ব্যর্থ, ডিবাগ APK রাখা হলো"
              cp "$APK" "$OUT"
            fi

            rm -f goldmanager.p12
          else
            echo "ডিবাগ কী দিয়ে APK তৈরি হয়েছে"
          fi

          ls -l "$OUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Gold Manager v${{ github.run_number }}
          files: sona-rupa-hisab.apk
          make_latest: true
