name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          if [ -f index.html ]; then
            mkdir -p www
            cp index.html www/index.html
            sed -i "s/__APP_BUILD__/${{ github.run_number }}/g" www/index.html
          fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Firebase config
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json যোগ হয়েছে"
          else
            echo "google-services.json পাওয়া যায়নি, পুশ নোটিফিকেশন কাজ করবে না"
          fi

      - name: Generate app icon
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx --yes @capacitor/assets generate --android
          fi

      - name: Fullscreen mode
        run: |
          cat > android/app/src/main/java/com/sonarupa/hisab/MainActivity.java <<'JAVA'
          package com.sonarupa.hisab;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              hideSystemBars();
            }

            @Override
            public void onResume() {
              super.onResume();
              hideSystemBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                hideSystemBars();
              }
            }

            private void hideSystemBars() {
              getWindow().getDecorView().post(new Runnable() {
                @Override
                public void run() {
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
                }
              });
            }
          }
          JAVA
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item>\n        <item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml
          grep -n "windowFullscreen" android/app/src/main/res/values/styles.xml || echo "styles.xml এ windowFullscreen বসেনি"

      - name: Fixed signing key and version code
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "স্থায়ী সাইনিং কী বসেছে"
          else
            echo "KEYSTORE_BASE64 secret নেই: প্রতিবার আলাদা কী ব্যবহার হবে, তাই আপডেট ইন্সটল নাও হতে পারে"
          fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle || echo "versionCode বদলানো যায়নি"

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sona-rupa-hisab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sona-rupa-hisab-apk
          path: sona-rupa-hisab.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: sona-rupa-hisab.apk
          make_latest: true
