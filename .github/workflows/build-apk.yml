name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          if [ -f index.html ]; then
            mkdir -p www
            cp index.html www/index.html
            sed -i "s/__APP_BUILD__/${{ github.run_number }}/g" www/index.html
            echo "বিল্ড নম্বর: ${{ github.run_number }}"
          fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Firebase config
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json যোগ হয়েছে"
          else
            echo "google-services.json পাওয়া যায়নি, পুশ নোটিফিকেশন কাজ করবে না"
          fi

      - name: Generate app icon
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx --yes @capacitor/assets generate --android
          fi

      - name: Fullscreen mode
        run: |
          cat > android/app/src/main/java/com/sonarupa/hisab/MainActivity.java <<'JAVA'
          package com.sonarupa.hisab;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              hideSystemBars();
            }

            @Override
            public void onResume() {
              super.onResume();
              hideSystemBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                hideSystemBars();
              }
            }

            private void hideSystemBars() {
              getWindow().getDecorView().post(new Runnable() {
                @Override
                public void run() {
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
                }
              });
            }
          }
          JAVA
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item>\n        <item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml
          grep -n "windowFullscreen" android/app/src/main/res/values/styles.xml || echo "styles.xml এ windowFullscreen বসেনি"

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          OUT=sona-rupa-hisab.apk
          cp "$APK" "$OUT"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > goldmanager.p12
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 "$APK" aligned.apk
            if "$BT/apksigner" sign --ks goldmanager.p12 --ks-type PKCS12 --ks-pass pass:goldmanager --key-pass pass:goldmanager --ks-key-alias goldmanager --out "$OUT" aligned.apk; then
              echo "স্থায়ী কী দিয়ে সাইন হয়েছে"
            else
              echo "সাইন ব্যর্থ হয়েছে, ডিবাগ কী দিয়েই APK রাখা হলো"
              cp "$APK" "$OUT"
            fi
            rm -f goldmanager.p12
          else
            echo "KEYSTORE_B64 সিক্রেট পাওয়া যায়নি, ডিবাগ কী দিয়ে APK রাখা হলো (আপডেট ওপরে ইনস্টল নাও হতে পারে)"
          fi
          ls -l "$OUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Gold Manager v${{ github.run_number }}
          files: sona-rupa-hisab.apk
          make_latest: true
